[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Empty on purpose: run_migrations(db_url) injects an absolute URL at app startup
# (see neobot_storage.engine). For the CLI pass an absolute path explicitly,
# never a relative one, or a stray neobot.db is created in the working directory:
#   alembic -x db_url=sqlite+aiosqlite:////absolute/path/to/neobot.db upgrade head
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
