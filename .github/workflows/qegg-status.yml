name: QuailEgg Status
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@v0.12.0
      - run: qegg status --json
