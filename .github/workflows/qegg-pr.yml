name: QuailEgg PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qegg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.head_ref != 'release'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@v0.12.0
      - name: Check
        run: qegg check --ci
      - name: Preview
        run: |
          qegg plan --markdown > plan.md
          if [ -s plan.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none -F plan.md
          else
            echo "no pending release; skipping the plan comment"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
