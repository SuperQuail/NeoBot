name: PR 标题

# PR 标题在 squash 合并时就是 main 上的提交标题，也是 release notes 里的那一行，
# 所以按 commit message 规范校验。编辑标题（edited）会重新触发，改名后立刻能看到结果。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: 标题规范（阻断）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 标题经环境变量传入，不拼进命令行：标题里的引号 / 反引号 / $ 不会影响 shell。
      # 想连「疑似罗列」的警告一起阻断，在下面加 --strict。
      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py
