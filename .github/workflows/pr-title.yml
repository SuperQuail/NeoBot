name: PR 标题

# 仓库 squash 设置为 PR_TITLE + PR_BODY：main 上的标题永远取 PR 标题、正文永远取 PR 描述，
# 所以 PR 标题必须符合 commit message 规范（它会被永久留在 git log 与 release notes 里）。
# 提交信息不进 main，不在这里校验。
# 编辑标题（edited）会重新触发，改名后立刻能看到结果。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: 标题规范（阻断）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 标题经环境变量传入，不拼进命令行：标题里的引号 / 反引号 / $ 不会影响 shell。
      # 想连「疑似罗列」的警告一起阻断，给下面加 --strict。
      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py
