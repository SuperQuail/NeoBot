name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 历史卫生：这些文件曾在历史里带有硬编码密钥 / 无用大图，已在远端历史中彻底清除。
  # 一旦被重新提交，清理就白做了，所以对任意来源的提交在这里兜底拦一次。
  hygiene:
    name: 历史卫生（阻断）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 阻止已从历史清除的调试脚本回流
        run: |
          denied="scripts/test_downloaded.png scripts/test_drawing_formats.py scripts/test_drawing_quick.py scripts/test_drawing_sim.py scripts/test_image_reference.py"
          hits=$(git log --all --oneline -- $denied)
          if [ -n "$hits" ]; then
            echo "::error::仓库历史中出现已从远端清除的调试脚本（含硬编码密钥），请移除相关提交。"
            echo "$hits" | head -n 20
            exit 1
          fi
          echo "OK：未发现已清除的调试脚本。"

  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # shortcut: 钉住 3.14 —— 不钉的话 uv 会浮动到最新 CPython（2026-10-10 的 3.15），
          # 而 onnxruntime 1.30.0 只有 cp313/cp314 wheel，uv sync --locked 直接装不上（issue #87）。
          # 上游发出 cp315 wheel 后把这里抬到 3.15，或改成仓库级 .python-version。
          python-version: "3.14"

      - name: 安装依赖
        run: uv sync --all-packages --locked

      - name: ruff
        run: uv run ruff check .

      - name: 测试
        run: uv run pytest --strict-markers -m "not browser and not network and not slow and not llm"

      - name: mypy
        continue-on-error: true
        run: uv run mypy app/src packages

      - name: 流程图体检（spec(13) F1/F2/F3）
        run: uv run python scripts/flow/check_flow_diagrams.py --strict-drift

      - name: 流程图逐块渲染校验（可选，失败仅警告）
        continue-on-error: true
        run: |
          node --version
          node scripts/flow/verify_flow_render.mjs

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src/neobot_app/builtin_plugins/dashboard/frontend
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/src/neobot_app/builtin_plugins/dashboard/frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/src/neobot_app/builtin_plugins/dashboard/frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

      - name: 校验构建产物已同步
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- ../web)" ]; then
            echo "::error::web/ 构建产物与源码不一致，请在 frontend 目录执行 pnpm run build 并提交产物。"
            git --no-pager diff --stat -- ../web
            exit 1
          fi
