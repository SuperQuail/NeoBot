name: Publish to PyPI

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      base_ref:
        required: false
        type: string

# Never cancel a release while it is uploading multiple workspace packages.
concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merged-pr:
    name: 确认发布来源可信（已合并 PR 或 release 手动触发）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.pr.outputs.merged }}
    steps:
      # Use push rather than pull_request.closed so merged fork PRs also receive
      # the trusted release-branch token/secrets. Direct pushes do not publish.
      # 新分支设计：只有 main → release 的合并 PR 才可信；
      # 手动触发是对 release 的显式动作：ref 不是 release 一律跳过。
      - uses: actions/github-script@v8
        id: pr
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('merged', String(context.ref === 'refs/heads/release'));
              return;
            }
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo,
              commit_sha: context.sha,
            });
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            let found = prs.some(pr => pr.merged_at &&
              pr.base.ref === 'release' && pr.head.ref === 'main' &&
              pr.base.repo.full_name === repoFullName && pr.head.repo.full_name === repoFullName &&
              pr.merge_commit_sha === context.sha);
            // 关联 API 在 push 刚发生时可能短暂查不到 squash 合并的 PR。
            // 回退到 squash 标题里的 (#NN)，再向 PR API 核实 merged/release 与 main 来源。
            if (!found) {
              const commit = await github.rest.repos.getCommit({ ...context.repo, ref: context.sha });
              const message = commit.data.commit.message || '';
              const match = message.match(/\(#(\d+)\)\s*$/);
              if (match) {
                const pr = await github.rest.pulls.get({ ...context.repo, pull_number: Number(match[1]) });
                found = Boolean(pr.data.merged_at) &&
                  pr.data.base.ref === 'release' &&
                  pr.data.head.ref === 'main' &&
                  pr.data.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  pr.data.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
              }
            }
            core.setOutput('merged', String(found));

  checks:
    name: 合并后质量门禁
    needs: merged-pr
    if: needs.merged-pr.outputs.merged == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: 检测版本、构建并发布
    needs: checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1

      - name: 检测版本更新
        id: version
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ -n "$EVENT_BEFORE" ]; then
            ARGS=(--base-ref "$EVENT_BEFORE")
          elif [ -n "$INPUT_BASE_REF" ]; then
            ARGS=(--base-ref "$INPUT_BASE_REF")
          else
            # 手动触发没有 github.event.before：默认不看 Git 基线，
            # 只把 release 当前版本里 PyPI 还缺的包补齐。
            ARGS=(--publish-missing)
          fi
          echo "prepare_release ${ARGS[*]}"
          uv run --no-project --python 3.13 --with packaging python scripts/prepare_release.py "${ARGS[@]}"

      - name: 检查发布凭据
        if: steps.version.outputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo '::error::请在 pypi environment 或仓库 secrets 配置 UV_PUBLISH_TOKEN'
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.publish == 'true'
        with:
          package_json_file: app/src/neobot_app/builtin_plugins/dashboard/frontend/package.json

      - uses: actions/setup-node@v6
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/src/neobot_app/builtin_plugins/dashboard/frontend/pnpm-lock.yaml

      - name: 检查 Python 锁文件
        if: steps.version.outputs.publish == 'true'
        run: uv lock --check

      - name: 构建与发布预检
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/publish.ps1 -DryRun

      - name: 上传已验证的产物
        if: steps.version.outputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ dist/*

  github-release:
    name: 创建 GitHub Release 与 tag
    needs: [merged-pr, checks, publish]
    # PyPI 发布成功、或该版本已在 PyPI（publish=false，手动触发补齐）时都补建 Release。
    if: needs.merged-pr.outputs.merged == 'true' && needs.checks.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@v10.0.1

      - name: 解析发布版本
        id: version
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # tag 用 PyPI 规范化版本：2.0.2-a13 -> v2.0.2a13，与历史 tag 一致
          read -r tag prerelease < <(uv run --no-project --python 3.13 --with packaging python -c 'import os; from packaging.version import Version; v = Version(os.environ["RELEASE_VERSION"]); print("v" + str(v), "true" if v.is_prerelease else "false")')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: 创建 tag 与 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 不 checkout 源码，gh 需要显式仓库上下文（否则 gh 会尝试从 .git 推断并失败）
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          title="$TAG"
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            title="$TAG — 预发布版本"
            extra+=(--prerelease)
          fi
          gh release create "$TAG" --target "$TARGET" --title "$title" "${extra[@]}" --generate-notes
