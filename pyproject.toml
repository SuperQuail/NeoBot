[project]
name = "neobot"
version = "1.2.4-a2"
description = "a QQ LLM Bot "
requires-python = ">=3.13"
authors = [
    { name = "wsrsq", email = "wsrsq001@163.com" },
    { name = "tangtian", email = "a14b@126.com" },
]
dependencies = [
    "drissionpage>=4.1,<4.2",
    "fpdf2>=2.8,<3",
    "markdown>=3.10,<4",
    "markdown-it-py>=3.0,<5",
    "openpyxl>=3.1,<4",
    "pikepdf>=9.0,<11",
    "pillowmd>=0.7.3,<0.8",
    "pypdf>=6.7,<7",
    "python-docx>=1.2.0,<2",
    "transformers>=5.9.0,<6",
    "xlsxwriter>=3.2,<4",
]
[[tool.uv.index]]
url="https://pypi.tuna.tsinghua.edu.cn/simple"
default=true

[tool.uv]
# 预发布一律不参与解析。默认值在不同 uv 版本/机器上出现过差异（allow vs if-necessary），
# 会让同一份 lock 解出不同版本 —— DrissionPage 5.0.0b1 就是这样被装进新部署的：
# 它删掉了顶层 ChromiumPage，装上去直接启动失败。
# 用 disallow 而不是 if-necessary：**即使别处（UV_PRERELEASE 环境变量、命令行、
# 其它工具）开了 allow，也以这里的 disallow 为准**（已实测）。
prerelease = "disallow"

[tool.uv.workspace]
members = [
    "packages/*",
    "app",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests", "packages/modloader/tests"]
pythonpath = ["app/src", "packages/contracts/src"]
addopts = "--tb=short"
# 每个用例默认 60s 超时：任何挂死（事件循环卡住、真实网络等待、死锁）都会
# 立即打印调用栈并结束本次运行，避免整轮测试被单个用例拖住浪费时间。
# 需要更长时间的用例（浏览器 / 真实 LLM / 网络）在用例上标注：
#   @pytest.mark.timeout(300)
timeout = 60
timeout_method = "thread"
markers = [
    "browser: 需要真实浏览器环境的测试 (不会在 CI 默认运行)",
    "network: 需要网络访问的测试",
    "slow: 执行时间较长的测试",
    "llm: 需要真实 LLM API 的测试",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1,<3",
    "prompt-toolkit>=3.0.0,<4",
    "pyinstaller>=6.19.0,<7",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.26.0,<2",
    "pytest-timeout>=2.3.1,<3",
    "ruff>=0.15.5,<0.17",
]

[tool.ruff]
# 起步用保守规则集（ruff 经典默认 E4/E7/E9/F）：先把「未使用导入 / 未定义名字 /
# 语法级问题」这类确定性缺陷挡在 CI 外，规则集再逐步扩大。
target-version = "py313"
line-length = 120
exclude = [
    "app/src/neobot_app/builtin_plugins/dashboard/web",
    "app/src/neobot_app/builtin_plugins/dashboard/frontend",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# 起步配置：存量类型错误较多，先不启用严格模式，仅用于暴露问题（CI 中暂不阻断）。
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = [
    "app/src/neobot_app/builtin_plugins/dashboard/web/",
    "app/src/neobot_app/builtin_plugins/dashboard/frontend/",
]
