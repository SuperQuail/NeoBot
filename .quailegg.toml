# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "dev"
repo = "github.com/SuperQuail/NeoBot"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "pr"
# 发布 PR 使用独立分支，避免与历史 release 分支冲突
branch = "qegg-release"
github_release = true
commit_message = "chore(release): v{{version}}"
version_scope = "shared"
# 发布 job 使用受保护的 pypi environment
environment = "pypi"

[changes]
dir = ".changes"
scope = ["app", "packages/adapter", "packages/chat", "packages/contracts", "packages/memory", "packages/modloader", "packages/storage"]

[verify]
commands = [
  "uv sync --all-packages --locked",
  "uv run ruff check .",
  "uv run pytest --strict-markers -m \"not browser and not network and not slow and not llm\"",
]
timeout = "45m"
fail_fast = true

[publish]
registries = ["pypi"]

[packages."python@neobot"]
name = "neobot"
path = "."
resolver = "python"
# 根项目没有 build-system，只参与共享版本，不发布到 PyPI
publish = false

[packages."python@neobot-adapter"]
name = "neobot-adapter"
path = "packages/adapter"
resolver = "python"
publish = true

[packages."python@neobot-app"]
name = "neobot-app"
path = "app"
resolver = "python"
publish = true

[packages."python@neobot-chat"]
name = "neobot-chat"
path = "packages/chat"
resolver = "python"
publish = true

[packages."python@neobot-contracts"]
name = "neobot-contracts"
path = "packages/contracts"
resolver = "python"
publish = true

[packages."python@neobot-memory"]
name = "neobot-memory"
path = "packages/memory"
resolver = "python"
publish = true

[packages."python@neobot-modloader"]
name = "neobot-modloader"
path = "packages/modloader"
resolver = "python"
publish = true

[packages."python@neobot-storage"]
name = "neobot-storage"
path = "packages/storage"
resolver = "python"
publish = true
