# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/SuperQuail/NeoBot"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "pr"
# 发布分支由 QuailEgg 从主分支重建并强制推送，不要手工提交到它
branch = "release"
github_release = true
commit_message = "chore(release): v{{version}}"
version_scope = "shared"
# 发布 job 使用受保护的 pypi environment
environment = "pypi"

[release.workflow]
# NeoBot 的两处运行时适配写在这里，生成的 qegg-release.yml 不再手改。
# 1) uv workspace 里 `uv build` 会把产物写到仓库根 dist/，而 qegg 随后在成员目录
#    `uv publish`；用 shim 把 build 输出固定到当前包目录。
# 2) onnxruntime 没有 cp315 wheel，固定 uv 使用 Python 3.14（与 CI 一致）。
yaml = '''
- name: Pin Python for uv
  run: echo "UV_PYTHON=3.14" >> "$GITHUB_ENV"
- name: Workaround uv workspace build output
  run: |
    real_uv="$(command -v uv)"
    mkdir -p "$RUNNER_TEMP/uv-shim"
    cat > "$RUNNER_TEMP/uv-shim/uv" <<EOF
    #!/usr/bin/env bash
    if [ "\$1" = "build" ]; then
      exec "$real_uv" build --out-dir "\$PWD/dist" "\${@:2}"
    fi
    exec "$real_uv" "\$@"
    EOF
    chmod +x "$RUNNER_TEMP/uv-shim/uv"
    echo "$RUNNER_TEMP/uv-shim" >> "$GITHUB_PATH"
'''

[changes]
dir = ".changes"
scope = ["app", "packages/adapter", "packages/chat", "packages/contracts", "packages/memory", "packages/modloader", "packages/storage"]

[verify]
commands = [
  "uv sync --all-packages --locked",
  "uv run ruff check .",
  "uv run pytest --strict-markers -m \"not browser and not network and not slow and not llm\"",
]
timeout = "45m"
fail_fast = true

[publish]
registries = ["pypi"]

[packages."python@neobot"]
name = "neobot"
path = "."
resolver = "python"
# 根项目没有 build-system，只参与共享版本，不发布到 PyPI
publish = false

[packages."python@neobot-adapter"]
name = "neobot-adapter"
path = "packages/adapter"
resolver = "python"
publish = true

[packages."python@neobot-app"]
name = "neobot-app"
path = "app"
resolver = "python"
publish = true

[packages."python@neobot-chat"]
name = "neobot-chat"
path = "packages/chat"
resolver = "python"
publish = true

[packages."python@neobot-contracts"]
name = "neobot-contracts"
path = "packages/contracts"
resolver = "python"
publish = true

[packages."python@neobot-memory"]
name = "neobot-memory"
path = "packages/memory"
resolver = "python"
publish = true

[packages."python@neobot-modloader"]
name = "neobot-modloader"
path = "packages/modloader"
resolver = "python"
publish = true

[packages."python@neobot-storage"]
name = "neobot-storage"
path = "packages/storage"
resolver = "python"
publish = true
