[project]
name = "neobot-app"
version = "1.2.4-a1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wsrsq", email = "wsrsq001@163.com" },
    { name = "tangtian", email = "a14b@126.com" },
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp<4",
    "beautifulsoup4>=4.12.0,<5",
    "cryptography>=46.0.0,<51",
    "ddgs>=9.0.0,<10",
    "drissionpage>=4.1,<4.2",
    "duckduckgo-search>=8.0.0,<9",
    "fpdf2>=2.8,<3",
    "httpx>=0.27.0,<0.29",
    "jsonschema>=4.23.0,<5",
    "loguru<0.8",
    "lxml>=5.0.0,<7",
    "Markdown>=3.10,<4",
    "markdown-it-py>=3.0,<5",
    "markdownify>=1.0.0,<2",
    "neobot-adapter",
    "neobot-chat",
    "neobot-contracts",
    "neobot-memory",
    "neobot-modloader",
    "neobot-storage",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18.0,<2",
    "openpyxl>=3.1,<4",
    "pillow>=10.0.0,<13",
    "pillowmd>=0.7.3,<0.8",
    "pikepdf>=9.0,<11",
    "playwright>=1.55.0,<2",
    "pypdf>=6.7,<7",
    "python-docx>=1.1.0,<2",
    "python-dotenv>=1.2.2,<2",
    "python-lsp-server>=1.14.0,<2",
    "readability-lxml>=0.8.0,<0.10",
    "requests>=2.32.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tomlkit<0.16",
    "trafilatura>=2.0.0,<3",
    "lunarcalendar>=0.0.9,<0.1",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
neobot = "neobot_app.cli:main"

[tool.uv.sources]
neobot-adapter = { workspace = true }
neobot-chat = { workspace = true }
neobot-contracts = { workspace = true }
neobot-memory = { workspace = true }
neobot-modloader = { workspace = true }
neobot-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 插件前端源码与 node_modules 不随包分发；插件目录内的构建产物 web/ 会保留，
# 因此部署方不需要 Node/前端工具链。
source-exclude = [
    "src/neobot_app/builtin_plugins/dashboard/frontend/**",
    "src/neobot_app/builtin_plugins/starship/frontend/**",
]
