[scene]
comment = "<场景>这是B站评论区。</场景>"
private = "<场景>这是B站私信。</场景>"
general = "<场景>这是B站。</场景>"
live = "<直播场景>这是B站直播间。</直播场景>"

# ── 身份块（who 由代码按 bot_name / bot_uid / other_name / bot_data 组装） ──

[identity]
block = '''<你是谁>
{who}
</你是谁>'''
name = "你的名字是{bot_name}"
uid = ",你的B站UID是{bot_uid}"
alias = ",也有人叫你{other_name}"

# ── 跨聊天任务 ──────────────────────────────────────────────────────────────

[task]
cross_chat = "<跨聊天任务>有人通过跨聊天把一项任务交给了你,你要在B站当前这个对话里发一句话回应。必须调用 send_reply 工具发送你要说的那句话;如果这个任务不适合在B站回应,调用 cancel。</跨聊天任务>"
background = '''<对话背景>
{history}
</对话背景>'''
instruction = '''<任务>
{task}
</任务>'''

# ── 动态日记 ────────────────────────────────────────────────────────────────

[diary]
cot = "<cot>这是你今天在QQ聊天的经历,你打算在B站写一篇动态作为日记,如果觉得没有什么好写的可以cancel掉,如果打算写,不要写隐私和具体的人名</cot>"
material_tool = "<日记素材>先调用 read_diary_material 查看今天的群聊摘要；每行前缀 + 表示今天新增/变化；材料多时用 offset 翻页；写好调用 send_dynamic 提交，今天不写就调用 cancel。</日记素材>"
rules = '''<动态要求>
你要写的是自己今天的一条B站动态:第一人称,像真人随手发的日常记录,不是工作周报。
不要出现QQ、QQ群号、QQ号、真实姓名、手机号、地址等隐私信息;不要把私聊原文大段贴出来。
不要编造今天没发生过的事;不清楚的细节就别写。不要使用markdown、话题标签(#)或艾特任何人。
正文只写动态内容,不要解释,不要加引号;写好用 send_dynamic 工具提交,直接输出不会被发布。
</动态要求>'''
requirement = "<日记要求>{requirement}</日记要求>"
length = "<长度>整条动态控制在{max_chars}字以内。</长度>"
truncated = "\n...[素材过长已截断]"
date = "<日期>{date_text}</日期>"
material = '''<今日聊天与档案>
{material}
</今日聊天与档案>'''

