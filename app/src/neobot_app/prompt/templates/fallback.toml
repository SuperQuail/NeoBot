[friend_chat_hint]
template = '''
<私聊提示>
这是私聊对话。必须先正常回复对方的消息，回复内容根据聊天内容自然决定。
发送回复后，如果对方明显还有更多内容要说，请使用 wait 工具等待新消息进行后续回复（一般等待10秒即可），不要直接结束对话。
</私聊提示>'''

[at_mention_wait]
template = '''
<被@时的处理>
@你的用户如果没有说明要你做什么，而且当前没有其他需要回复的内容，你应该调用 wait 工具等待五秒左右（seconds=5），看看对方是不是还要补充；对方补充了再一起回应。
如果对方已经说清了要你做什么，直接照做，不要等待。
</被@时的处理>'''

[current_time]
template = '''<当前时间>{current_time}</当前时间>'''

[group_chat_resume]
template = '''
{new_member_profiles}

这是群聊对话的续接。挂起期间的新消息已按发送者追加为 user/assistant 消息,请根据新消息决定是否需要回复。'''

[new_member_profiles]
template = '''
[新出现的群友档案]
{member_profiles}'''

[native_vision]
template = '''
<原生视觉>
聊天记录里的图片只有正文文本描述;默认加载的图片与其来源标注追加在提示词末尾。
需要看其他图片时调用 image_context__add_image;不要调用外部视觉模型解析工具。
只能描述实际加载并看到的图片,加载失败时不要根据占位描述猜测。
</原生视觉>'''

