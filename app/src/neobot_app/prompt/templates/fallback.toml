template = '''你刚刚正在睡觉,现在被叫醒了,还有点困.'''

[sleep_cmd]
template = '''你刚刚答应去睡觉（睡眠 {duration}，预计 {wake_at} 醒来）。请用你自己的语气自然回应一句，不要复述本条状态说明。'''

