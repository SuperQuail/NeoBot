name = "dashboard"
version = "1.0.0"
description = "NeoBot 网页面板：运行监测、日志、插件管理、本体配置在线编辑"
author = "NeoBot"
homepage = "https://github.com/SuperQuail/NeoBot"
license = "MIT"
tags = ["official", "web", "console"]

# 面板配置保存在插件数据目录 plugins_data/dashboard/config.toml（与本体 config.toml 完全解耦），
# 可在面板「插件 → dashboard → 配置」在线编辑；这里是打包默认值。
# 每行上方的注释会作为面板表单里的字段说明，并写进生成的 config.toml。
# 「面板是否启用」不是配置项，它记录在 plugin_state.json 里。

[config]
# 监听地址。0.0.0.0 对网络开放；只在本机使用请填 127.0.0.1。
host = "0.0.0.0"
# 监听端口。被占用时从该端口起向后自动尝试 10 个端口。
port = 9981
# 访问前缀，用于反向代理子路径部署（如 /neobot），留空表示根路径。
base_path = ""
# 是否允许在面板里做写操作（插件启停/安装、配置保存、待机重启）。关闭后面板变为只读。
manage_plugins = true
# 是否允许非本机来源做写操作。关闭后远程只能查看，改配置仅限本机。
allow_remote_manage = true
# 登录会话有效期（分钟），超时后需要重新登录。
session_timeout_minutes = 720
# 面板内存中保留的日志条数（用于「日志」页实时滚动）。
log_buffer_size = 500
# 机器人信息（昵称/版本/头像）的缓存秒数，0 表示每次都重新查询。
bot_info_cache_ttl = 300
# 有人查看面板时的延迟探测间隔（秒）。探测会真实调用一次 get_status；0 表示彻底关闭探针。
latency_probe_interval_seconds = 60
# 无人在线时的延迟探测间隔（秒）。0（默认）表示完全停止探测，不产生任何 API 调用。
latency_probe_idle_seconds = 0
# 面板会话视为「有人在线」的活跃窗口（秒）；最后一次请求在此窗口内才认为有人在看面板。
latency_probe_active_window_seconds = 120
# 空闲/未探测时复检门控条件的间隔（秒）。该间隔不产生 API 调用，只用于及时发现有人重新打开面板。
latency_probe_gate_check_seconds = 30
# 是否允许在「档案」页删除档案记录。默认关闭（防止误删长期记忆）；与模型侧 agent.memory.archive.allow_delete 完全独立。
allow_archive_delete = false
# 面板指标历史（消息量、延迟、用量）的保留天数。
history_max_days = 30
# 同一来源在统计窗口内允许的登录失败次数，超过后暂时封禁。
login_max_failures = 5
# 登录失败次数统计窗口（秒）。
login_rate_limit_window_seconds = 600
# 会话 Cookie 是否只在 HTTPS 下发送。确认反向代理 HTTPS 生效后再开启。
secure_cookies = false
# 是否信任反向代理写入的客户端地址头（X-Forwarded-For/Host）。仅在代理可信时开启。
trust_proxy_headers = false
